<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-8 bg-slate-100">
  <div class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
    <h1 class="text-xl font-bold mb-1">Smart-Roster System</h1>
    <p class="text-sm text-slate-500 mb-6">Klik tombol di bawah untuk membuat jadwal bulanan secara otomatis.</p>
    
    <button onclick="prosesWizard()" id="btnAction" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition">
      Mulai Setup & Smart Fill
    </button>
  </div>

  <script>
    // GANTI URL INI DENGAN URL WEB APP ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbw1re5yfz_VuK6jQkatghp3FUFcMU7f_xBKgqtgxSd9RV2fbayhZz31VYtNzLUM0NmL/exec"; 

    async function prosesWizard() {
      const btn = document.getElementById("btnAction");
      btn.disabled = true;
      btn.textContent = "Sedang memproses, mohon tunggu...";
      
      const thn = "2026", bln = "05"; // Anda bisa mengubah ini menjadi input dinamis
      
      try {
        // 1. Inisialisasi Matriks
        await fetch(`${API_URL}?action=getMatriks&tahun=${thn}&bulan=${bln}`);
        
        // 2. Jalankan Smart Fill (Otomatis Isi)
        await fetch(`${API_URL}?action=smartFill&tahun=${thn}&bulan=${bln}`);
        
        alert("Sukses! Jadwal berhasil dibuat dan diisi otomatis.");
        location.reload();
      } catch (err) {
        console.error(err);
        alert("Gagal terhubung. Pastikan Web App sudah di-deploy dengan akses 'Anyone'.");
        btn.disabled = false;
        btn.textContent = "Coba Lagi";
      }
    }
  </script>
</body>
</html>
