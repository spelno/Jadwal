<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-5 bg-slate-50">
  <h1 class="text-xl font-bold mb-4">Smart-Roster System</h1>
  <button onclick="prosesWizard()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">Mulai Setup & Smart Fill</button>
  
  <div id="tabelContainer" class="mt-6 bg-white p-4 rounded-xl shadow"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbys76KUIkwMi_Nz5GThKq2Y0Sf-FgXsLRgdKBqWPp_NSFXmLdgHI5DktitXVfuEryGG/exec"; // GANTI DENGAN URL WEB APP ANDA

    async function prosesWizard() {
      const thn = "2026", bln = "05"; // Bisa dibuatkan input prompt
      alert("Memproses Setup & Smart Fill...");
      
      // 1. Inisialisasi Matriks
      await fetch(`${API_URL}?action=getMatriks&tahun=${thn}&bulan=${bln}`);
      
      // 2. Jalankan Smart Fill (Otomatis Isi Kosong)
      await fetch(`${API_URL}?action=smartFill&tahun=${thn}&bulan=${bln}`);
      
      alert("Jadwal berhasil dibuat dan diisi otomatis!");
      location.reload();
    }
  </script>
</body>
</html>
